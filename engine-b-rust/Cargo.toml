[package]
name = "autoclicker_engine_b"
version = "1.0.0"
edition = "2021"
description = "OP 4.1 Killer Engine B - Rust/egui dual-mode auto-clicker"

[dependencies]
eframe = "=0.27.2"
egui = "=0.27.2"
windows-sys = { version = "=0.52.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_Media",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
