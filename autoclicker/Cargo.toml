[package]
name = "macro_clicker"
version = "1.4.1"
edition = "2021"
description = "MacroClicker — OP Auto Clicker 4.1-style Rust/egui Windows auto-clicker with record & playback, global and background click modes"

[dependencies]
eframe = "=0.27.2"
egui = "=0.27.2"
windows-sys = { version = "=0.52.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_Media",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_UI_Shell",
] }

[build-dependencies]
winresource = "=0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
incremental = false
debug = false
panic = "abort"
strip = true
