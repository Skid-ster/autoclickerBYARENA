name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows (x86_64-msvc)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all --manifest-path autoclicker/Cargo.toml -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --manifest-path autoclicker/Cargo.toml -- -D warnings

      - name: Test suite
        run: cargo test --manifest-path autoclicker/Cargo.toml -- --nocapture

      - name: Release build
        run: cargo build --release --manifest-path autoclicker/Cargo.toml

      # The shipped binary must stay a pure GUI application: fail the
      # build if the console subsystem ever creeps back (that is what
      # opened a cmd window next to the app) or if the embedded icon /
      # version metadata goes missing. ProductName can only exist if
      # the resource compile that also embeds the icon succeeded.
      - name: Verify GUI subsystem and embedded metadata
        run: |
          $exe = "autoclicker/target/release/macro_clicker.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 4 + 20 + 68)
          if ($subsystem -ne 2) { throw "exe subsystem is $subsystem, expected 2 (Windows GUI, no console)" }
          $vi = (Get-Item $exe).VersionInfo
          if ($vi.ProductName -ne "MacroClicker") { throw "embedded version metadata missing (ProductName='$($vi.ProductName)')" }
          Write-Host "Subsystem=$subsystem (Windows GUI) ProductName=$($vi.ProductName) FileVersion=$($vi.FileVersion) Size=$((Get-Item $exe).Length) bytes"

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: macro_clicker-windows-x64
          path: autoclicker/target/release/macro_clicker.exe
          if-no-files-found: error

      # Pushing a version tag (v*.) publishes a GitHub Release with the
      # compiled exe attached (GitHub displays the file's SHA-256 digest
      # under the asset automatically, so no separate checksum file is
      # needed). Re-running the workflow for an existing tag re-uploads
      # the asset instead of failing on the already-created release.
      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item autoclicker/target/release/macro_clicker.exe ./macro_clicker.exe
          gh release create $tag ./macro_clicker.exe --title "MacroClicker $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag ./macro_clicker.exe --clobber
          }
          exit $LASTEXITCODE
