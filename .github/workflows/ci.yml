name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows (x86_64-msvc)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all --manifest-path autoclicker/Cargo.toml -- --check

      - name: Clippy (advisory)
        run: cargo clippy --manifest-path autoclicker/Cargo.toml

      - name: Test suite
        run: cargo test --manifest-path autoclicker/Cargo.toml -- --nocapture

      - name: Release build
        run: cargo build --release --manifest-path autoclicker/Cargo.toml

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: op_auto_clicker-windows-x64
          path: autoclicker/target/release/op_auto_clicker.exe
          if-no-files-found: error
